# Skyramp Workspace Configuration
workspace:
  repoName: nkumar0101/new-project
  repoUrl: git@github-personal:nkumar0101/new-project.git
metadata:
  schemaVersion: v1
  mcpVersion: 0.0.59
  executorVersion: v1.3.11
  createdAt: "2026-03-05T19:18:50.737Z"
  updatedAt: "2026-03-05T19:18:50.743Z"
services:
  - serviceName: ecommerce-backend
    language: javascript
    framework: playwright
    outputDir: tests
    api:
      schemaPath: openapi.yaml
      authType: none
      baseUrl: http://localhost:3001
    runtimeDetails:
      serverStartCommand: npm install && node backend/server.js
      runtime: local
  - serviceName: ecommerce-frontend
    language: typescript
    framework: playwright
    outputDir: tests
    api:
      baseUrl: http://localhost:3000
    runtimeDetails:
      serverStartCommand: cd frontend && npm install && npm run dev
      runtime: local
