name: Skyramp Testbot

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  testbot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: skyramp/testbot@SKYR-3625
        with:
          skyramp_license_file: ${{ secrets.SKYRAMP_LICENSE }}
          anthropic_api_key: ${{ secrets.SKYRAMP_TESTBOT_API_KEY }}
          target_setup_command: './scripts/testbot-target-setup.sh'
          auth_token_command: >
            curl -s -X POST https://new-project-git-nk-testbot-nkumar0101s-projects.vercel.app/api/auth/login
            -H "Content-Type: application/json"
            -d '{"email":"admin@shopeasy.com","password":"password123"}'
            | jq -r '.token'
          test_directory: 'tests'
          skyramp_mcp_version: next
          skyramp_executor_version: v1.3.13
